<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta
      name="description"
      content="Plataforma de estudos com banco de questões, explicações didáticas, simuladores e ferramentas para vestibulares e concursos militares."
    />
    <link rel="canonical" href="https://www.projetovetor.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Projeto Vetor" />
    <meta property="og:title" content="Projeto Vetor | Plataforma de Estudos" />

    <!-- MathJax para renderizar fórmulas LaTeX -->
    <script>
      window.MathJax = {
        loader: {
          load: ["[tex]/mhchem"],
        },
        tex: {
          packages: { "[+]": ["mhchem"] },
          macros: {
            sen: "\\operatorname{sen}",
          },
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        svg: {
          // Self-contained SVGs can also be rasterized safely by the PDF exporter.
          fontCache: "none",
        },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
